name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true
        cache-dependency-path: go.sum

    - name: Validate
      shell: pwsh
      run: |
        go mod tidy -diff
        go vet ./...
        $goArch = (go env GOARCH).Trim()
        if ($goArch -eq 'amd64') {
          go test -mod=readonly -v -race ./...
        } else {
          go test -mod=readonly -v ./...
        }

    - name: Get Version info
      id: vars
      shell: bash
      run: |
        echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

    - name: Build Executable
      shell: bash
      run: |
        mkdir -p dist
        go build -v -ldflags="-s -w \
        -X 'github.com/thesubh213/winitrix/cmd.version=${{ steps.vars.outputs.version }}' \
        -X 'github.com/thesubh213/winitrix/cmd.commit=${{ steps.vars.outputs.commit }}' \
        -X 'github.com/thesubh213/winitrix/cmd.date=${{ steps.vars.outputs.date }}' \
        -X 'github.com/thesubh213/winitrix/cmd.goVersion=$(go version | cut -d' ' -f3)'" \
        -o dist/winitrix.exe .

    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup -y

    - name: Build Installer
      shell: pwsh
      run: |
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        & $iscc /DMyAppVersion=${{ steps.vars.outputs.version }} installer\winitrix.iss

    - name: Create ZIP Archive
      shell: pwsh
      run: |
        Compress-Archive -Path dist/winitrix.exe, README.md, LICENSE -DestinationPath dist/winitrix-${{ steps.vars.outputs.version }}-windows-amd64.zip

    - name: Generate Checksums
      shell: bash
      run: |
        cd dist
        sha256sum winitrix.exe > checksums.txt
        sha256sum winitrix-${{ steps.vars.outputs.version }}-windows-amd64.zip >> checksums.txt
        sha256sum winitrix-setup-${{ steps.vars.outputs.version }}.exe >> checksums.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/winitrix.exe
          dist/winitrix-${{ steps.vars.outputs.version }}-windows-amd64.zip
          dist/winitrix-setup-${{ steps.vars.outputs.version }}.exe
          dist/checksums.txt
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
