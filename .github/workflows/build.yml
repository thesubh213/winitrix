name: Build and Validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    name: Lint & Test
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true
        cache-dependency-path: go.sum

    - name: Verify Dependencies
      shell: bash
      run: go mod tidy -diff

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest

    - name: Run Tests
      run: go test -mod=readonly -v -race ./...

  build-windows:
    name: Build Windows Binary
    needs: validate
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true
        cache-dependency-path: go.sum

    - name: Build Optimized Executable
      shell: bash
      run: |
        go build -v -ldflags="-s -w" -o winitrix.exe .

    - name: Verify Startup
      shell: pwsh
      run: |
        ./winitrix.exe --version
