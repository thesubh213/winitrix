name: Build and Validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Lint & Test
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Verify Dependencies
      shell: bash
      run: |
        go mod tidy
        if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
          echo "::error::go.mod or go.sum is not tidy. Please run 'go mod tidy' locally and commit the result."
          exit 1
        fi

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest

    - name: Run Tests
      run: go test -v -race ./...

  build-windows:
    name: Build Windows Binary
    needs: validate
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Build Optimized Executable
      shell: bash
      run: |
        go build -v -ldflags="-s -w" -o winitrix.exe ./main.go

    - name: Verify Startup
      shell: pwsh
      run: |
        ./winitrix.exe --version
